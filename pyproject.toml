[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-analysis-part2"
version = "0.1.0"
description = "BERT-based three-class sentiment analysis and sentiment ranking"
requires-python = ">=3.9,<3.11"
dependencies = [
  "torch==2.2.2",
  "transformers==4.40.2",
  "pandas==2.2.2",
  "scikit-learn==1.4.2",
  "tqdm==4.66.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
